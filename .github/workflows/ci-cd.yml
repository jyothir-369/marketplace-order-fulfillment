# ============================================
# GitHub Actions CI/CD Pipeline
# Multi-workspace monorepo: @marketplace/backend + @marketplace/frontend
#
# RESOLVED from jyothir <-> main merge:
#   - Keeps the modern job names / Vercel frontend build+deploy from main.
#   - Keeps the Postgres-backed backend test suite and staging gate from jyothir.
#   - Fixes the deploy-frontend step indentation that broke YAML parsing.
#   - Harden dependency install: single root package-lock.json (workspace-safe),
#     workspace lint/type-check scripts, and no swallowed failures.
# ============================================
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Lint & Type Check
  # ============================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies (monorepo root)
        run: npm ci
      - name: Verify lockfile is in sync
        run: npm install --package-lock-only --ignore-scripts --dry-run
      - name: Lint backend
        working-directory: apps/backend
        run: npm run lint
      - name: Lint frontend
        working-directory: apps/frontend
        run: npm run lint
      - name: Type check backend
        working-directory: apps/backend
        run: npm run type-check
      - name: Type check frontend
        working-directory: apps/frontend
        run: npm run type-check

  # ============================================
  # Build - Backend
  # ============================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build backend
        working-directory: apps/backend
        run: npm run build
      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/
          retention-days: 7

  # ============================================
  # Build - Frontend
  # ============================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build
      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next
          path: apps/frontend/.next/
          retention-days: 7

  # ============================================
  # Backend Unit + Integration Tests (Postgres)
  # ============================================
  backend-tests:
    name: Backend Tests (unit + integration)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Backend unit tests
        working-directory: apps/backend
        run: npm test -- --runInBand
      - name: Backend e2e tests
        working-directory: apps/backend
        run: npm run test:e2e -- --runInBand
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: marketplace
          NODE_ENV: test
          REDIS_HOST: localhost
      - name: Backend type check
        working-directory: apps/backend
        run: npm run type-check

  # ============================================
  # Docker Build & Push - Backend Only
  # Runs only on main branch pushes
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: apps/backend/Dockerfile

  # ============================================
  # Staging Validation (gate before prod)
  # ============================================
  staging:
    name: Validate & Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, backend-tests]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: "Backend build (smoke: full compile)"
        working-directory: apps/backend
        run: npm run build
      - name: Frontend build (production)
        working-directory: apps/frontend
        run: npm run build
      - name: Configure AWS credentials (staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Deploy to staging cluster
        run: |
          echo "Staging validation passed - deploy to staging service."
          echo "In production this step renders the task definition and runs AWS ECS deploy with wait-for-service-stability against the staging service."

  # ============================================
  # Deploy Backend to Railway (Production)
  # ============================================
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Railway via CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up --service marketplace-backend --environment production

  # ============================================
  # Vercel Production Deploy - Frontend
  # ============================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          vercel-args: --prod
          working-directory: apps/frontend
