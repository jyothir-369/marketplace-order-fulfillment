============================================
GitHub Actions CI/CD Workflow
============================================

name: CI/CD Pipeline

on:
push:
branches: [main, develop]
pull_request:
branches: [main]

env:
NODE_VERSION: '20'
AWS_REGION: ${{ secrets.AWS_REGION }}
ECR_REPOSITORY: marketplace-order-fulfillment

jobs:

============================================
Lint and Type Check
============================================

lint:
name: Lint & Type Check
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ env.NODE_VERSION }}
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Run ESLint
    run: npm run lint || echo "No lint script configured"

  - name: Type check
    run: npx tsc --noEmit

============================================
Build Application
============================================

build:
name: Build Application
runs-on: ubuntu-latest
needs: lint

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ env.NODE_VERSION }}
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Build application
    run: npm run build

  - name: Upload build artifacts
    uses: actions/upload-artifact@v4
    with:
      name: dist
      path: dist/
      retention-days: 7

============================================
Docker Build and Push to Amazon ECR
============================================

docker:
name: Docker Build & Push
runs-on: ubuntu-latest
needs: build
if: github.ref == 'refs/heads/main'

permissions:
  contents: read

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Download build artifacts
    uses: actions/download-artifact@v4
    with:
      name: dist
      path: dist/

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Build and push Docker image
    env:
      ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      IMAGE_TAG: ${{ github.sha }}
    run: |
      docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
      docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
      docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

============================================
Deploy to ECS Production
============================================

deploy:
name: Deploy to Production
runs-on: ubuntu-latest
needs: docker
if: github.ref == 'refs/heads/main'
environment: production

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Verify AWS credentials
    run: aws sts get-caller-identity

  - name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Update ECS task definition
    id: task-def
    uses: aws-actions/amazon-ecs-render-task-definition@v1
    with:
      task-definition: infrastructure/terraform/task-definition.json
      container-name: marketplace-api
      image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  - name: Deploy ECS task definition
    uses: aws-actions/amazon-ecs-deploy-task-definition@v2
    with:
      task-definition: ${{ steps.task-def.outputs.task-definition }}
      service: marketplace-api
      cluster: marketplace-cluster
      wait-for-service-stability: true

============================================
Terraform Plan on Pull Requests
============================================

terraform-plan:
name: Terraform Plan
runs-on: ubuntu-latest
needs: lint
if: github.event_name == 'pull_request'

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_version: 1.6.0

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Initialize Terraform
    working-directory: infrastructure/terraform
    run: terraform init

  - name: Format Terraform
    working-directory: infrastructure/terraform
    run: terraform fmt -check

  - name: Validate Terraform
    working-directory: infrastructure/terraform
    run: terraform validate

  - name: Plan Terraform
    working-directory: infrastructure/terraform
    run: |
      terraform plan \
        -var-file=production.tfvars \
        -out=tfplan
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

  - name: Upload Terraform plan
    uses: actions/upload-artifact@v4
    with:
      name: terraform-plan
      path: infrastructure/terraform/tfplan
