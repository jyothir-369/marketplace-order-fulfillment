
# ============================================
# GitHub Actions CI/CD Pipeline
# Monorepo: @marketplace/backend + @marketplace/frontend
# Backend: Render (deployment managed separately)
# Frontend: Vercel
# Container Registry: GitHub Container Registry
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Lint and Type Check
  # ============================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint workspaces
        run: npm run lint --workspaces --if-present

      - name: Type check backend
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Type check frontend
        working-directory: apps/frontend
        run: npx tsc --noEmit

  # ============================================
  # Backend Unit Tests
  # ============================================
  test-backend:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        working-directory: apps/backend
        run: npm test -- --runInBand

  # ============================================
  # Build Backend
  # ============================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Verify backend build output
        shell: bash
        run: |
          if [ ! -d "apps/backend/dist" ]; then
            echo "::error::Backend build output apps/backend/dist was not created."
            exit 1
          fi
          echo "Backend build output found."

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Build Frontend
  # ============================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Verify frontend build output
        shell: bash
        run: |
          echo "Checking frontend build output..."
          if [ -d "apps/frontend/.next" ]; then
            echo "Next.js build output found."
            ls -la apps/frontend/.next
          else
            echo "::error::apps/frontend/.next was not created."
            echo "Checking alternative output directories..."
            find apps/frontend -maxdepth 2 -type d \
              \( -name .next -o -name standalone -o -name out \) \
              -print
            exit 1
          fi

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next
          path: apps/frontend/.next/
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Docker Build and Push
  # Main branch pushes only
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs:
      - build-backend
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Deploy Frontend to Vercel
  # Main branch pushes only
  # ============================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs:
      - build-frontend
      - build-backend
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate Vercel configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          [[ -n "$VERCEL_TOKEN" ]] || {
            echo "::error::Missing secret VERCEL_TOKEN"
            exit 1
          }

          [[ -n "$VERCEL_ORG_ID" ]] || {
            echo "::error::Missing secret VERCEL_ORG_ID"
            exit 1
          }

          [[ -n "$VERCEL_PROJECT_ID" ]] || {
            echo "::error::Missing secret VERCEL_FRONTEND_PROJECT_ID"
            exit 1
          }

      # Link the intended Vercel project.
      - name: Link Vercel project
        working-directory: apps/frontend
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          mkdir -p .vercel

          node -e '
            const fs = require("fs");
            fs.writeFileSync(
              ".vercel/project.json",
              JSON.stringify({
                orgId: process.env.VERCEL_ORG_ID,
                projectId: process.env.VERCEL_PROJECT_ID
              }, null, 2) + "\n"
            );
          '

          npx --yes vercel@latest project inspect \
            "$VERCEL_PROJECT_ID" \
            --token="$VERCEL_TOKEN"

      # Pull production environment variables and settings.
      - name: Pull Vercel Production Settings
        working-directory: apps/frontend
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          npx --yes vercel@latest pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      # Build using Vercel's production configuration.
      - name: Build Frontend for Production
        working-directory: apps/frontend
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          npx --yes vercel@latest build \
            --prod \
            --token="$VERCEL_TOKEN"

      # Deploy the already-built Vercel output.
      - name: Deploy Frontend to Vercel
        working-directory: apps/frontend
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          npx --yes vercel@latest deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
