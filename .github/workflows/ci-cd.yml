# ============================================
# GitHub Actions CI/CD Pipeline
# Monorepo: @marketplace/backend + @marketplace/frontend
# Backend: Render (deployment managed separately)
# Frontend: Vercel
# Container Registry: GitHub Container Registry
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERCEL_CLI_VERSION: "63.1.2"

jobs:
  # ============================================
  # Lint and Type Check
  # ============================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint workspaces
        run: npm run lint --workspaces --if-present

      - name: Type check backend
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Type check frontend
        working-directory: apps/frontend
        run: npx tsc --noEmit

  # ============================================
  # Backend Unit Tests
  # ============================================
  test-backend:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: migrationtest
          POSTGRES_PASSWORD: migrationtest
          POSTGRES_DB: marketplace_migration_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U migrationtest -d marketplace_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-e2e:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2euser
          POSTGRES_PASSWORD: e2epass
          POSTGRES_DB: marketplace_migration_e2e_tmp
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U e2euser -d marketplace_migration_e2e_tmp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://migrationtest:migrationtest@localhost:55439/marketplace_migration_test
      MIGRATION_E2E_DATABASE_URL: postgresql://e2euser:e2epass@localhost:55440/marketplace_migration_e2e_tmp
      CATALOG_REGRESSION_DB_HOST: 127.0.0.1
      CATALOG_REGRESSION_DB_PORT: "55439"
      CATALOG_REGRESSION_DB_NAME: marketplace_catalog_regression_test
      CATALOG_REGRESSION_DB_USER: migrationtest
      CATALOG_REGRESSION_DB_PASSWORD: migrationtest
      ISOLATED_TEST_DB_HOST: 127.0.0.1
      ISOLATED_TEST_DB_PORT: "55439"
      ISOLATED_TEST_DB_NAME: marketplace_migration_constraints_test
      ISOLATED_TEST_DB_USER: migrationtest
      ISOLATED_TEST_DB_PASSWORD: migrationtest
      MIGRATION_TEST_DB_HOST: 127.0.0.1
      MIGRATION_TEST_DB_PORT: "55439"
      MIGRATION_TEST_DB_NAME: marketplace_migration_constraints_test
      MIGRATION_TEST_DB_USER: migrationtest
      MIGRATION_TEST_DB_PASSWORD: migrationtest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create isolated regression databases
        working-directory: apps/backend
        env:
          PGPASSWORD: migrationtest
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 55439 -U migrationtest -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE marketplace_migration_constraints_test"
          psql -h 127.0.0.1 -p 55439 -U migrationtest -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE marketplace_catalog_regression_test"

      - name: Provision catalog regression schema and fixtures
        working-directory: apps/backend
        run: npx ts-node --project tsconfig.json src/catalog/test/setup-catalog-regression-db.ts
      - name: Run backend tests
        working-directory: apps/backend
        run: npm test -- --runInBand

  # ============================================
  # Build Backend
  # ============================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Verify backend build output
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/backend/dist || {
            echo "::error::Backend build output apps/backend/dist was not created."
            exit 1
          }
          echo "Backend build output found."

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Migration Registry & Integration Tests
  # ============================================
  migration-registry-verify:
    name: Migration Registry Verification
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci


      - name: Migration registry verification
        working-directory: apps/backend
        run: npm run migration:verify

  # ============================================
  # Build Frontend
  # ============================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://marketplace-backend-api-7cqo.onrender.com/api
    needs:
      - lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Verify frontend build output
        working-directory: apps/frontend
        shell: bash
        run: |
          set -euo pipefail
          test -d .next || {
            echo "::error::Frontend build output apps/frontend/.next was not created."
            exit 1
          }
          echo "Frontend build output found."

  # ============================================
  # Docker Build and Push
  # Main branch pushes only
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs:
      - build-backend
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Deploy Frontend to Vercel
  # Main branch pushes only
  #
  # IMPORTANT: Every Vercel CLI command runs from the REPOSITORY ROOT.
  # The Vercel project's "Root Directory" setting (apps/frontend) is
  # applied by Vercel itself. Running the CLI from inside apps/frontend
  # would make it resolve apps/frontend/apps/frontend and fail.
  # ============================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs:
      - build-frontend
      - build-backend
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate Vercel configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          test -n "$VERCEL_TOKEN" || {
            echo "::error::Missing secret VERCEL_TOKEN"
            exit 1
          }

          test -n "$VERCEL_ORG_ID" || {
            echo "::error::Missing secret VERCEL_ORG_ID"
            exit 1
          }

          test -n "$VERCEL_PROJECT_ID" || {
            echo "::error::Missing secret VERCEL_FRONTEND_PROJECT_ID"
            exit 1
          }

          test -f apps/frontend/package.json || {
            echo "::error::Frontend package.json is missing"
            exit 1
          }

          echo "Required frontend files and Vercel secrets are present."

      # Link the project at the repository root (no working-directory).
      - name: Link Vercel project
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          mkdir -p .vercel

          node -e '
            const fs = require("fs");
            fs.writeFileSync(
              ".vercel/project.json",
              JSON.stringify({
                orgId: process.env.VERCEL_ORG_ID,
                projectId: process.env.VERCEL_PROJECT_ID
              }, null, 2) + "\n"
            );
          '

          echo "Vercel project link created at repository root."

      # Let Vercel build remotely using the project's dashboard settings
      # (Framework Preset, Root Directory = apps/frontend, env vars).
      # No --prebuilt: the local build output is not used.
      - name: Deploy Frontend to Vercel
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          url="$(npx --yes vercel@"$VERCEL_CLI_VERSION" deploy \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN" | tail -n 1)"

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      # Fail the job if the deployment is empty (404) or broken (5xx).
      # 401/403 only means Vercel deployment protection is on, so warn.
      - name: Smoke test deployment
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$DEPLOY_URL" || echo 000)"

          echo "GET $DEPLOY_URL -> HTTP $code"

          case "$code" in
            404|5*|000)
              echo "::error::Deployment is not serving correctly (HTTP $code)."
              exit 1
              ;;
            401|403)
              echo "::warning::HTTP $code - Vercel deployment protection is on; could not verify content."
              ;;
          esac
