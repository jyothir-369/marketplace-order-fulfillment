# ============================================
# GitHub Actions CI/CD Pipeline
# Monorepo: @marketplace/backend + @marketplace/frontend
# Backend: Render (deployment managed separately)
# Frontend: Vercel
# Container Registry: GitHub Container Registry
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERCEL_CLI_VERSION: "63.1.2"

jobs:
  # ============================================
  # Lint and Type Check
  # ============================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint workspaces
        run: npm run lint --workspaces --if-present

      - name: Type check backend
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Type check frontend
        working-directory: apps/frontend
        run: npx tsc --noEmit

  # ============================================
  # Backend Unit Tests
  # ============================================
  test-backend:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        working-directory: apps/backend
        run: npm test -- --runInBand

  # ============================================
  # Build Backend
  # ============================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Verify backend build output
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/backend/dist || {
            echo "::error::Backend build output apps/backend/dist was not created."
            exit 1
          }
          echo "Backend build output found."

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Build Frontend
  # ============================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Verify frontend build output
        working-directory: apps/frontend
        shell: bash
        run: |
          set -euo pipefail
          test -d .next || {
            echo "::error::Frontend build output apps/frontend/.next was not created."
            exit 1
          }
          echo "Frontend build output found."

  # ============================================
  # Docker Build and Push
  # Main branch pushes only
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs:
      - build-backend
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Deploy Frontend to Vercel
  # Main branch pushes only
  #
  # IMPORTANT: Every Vercel CLI command runs from the REPOSITORY ROOT.
  # The Vercel project's "Root Directory" setting (apps/frontend) is
  # applied by Vercel itself. Running the CLI from inside apps/frontend
  # would make it resolve apps/frontend/apps/frontend and fail.
  # ============================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs:
      - build-frontend
      - build-backend
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate Vercel configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          test -n "$VERCEL_TOKEN" || {
            echo "::error::Missing secret VERCEL_TOKEN"
            exit 1
          }

          test -n "$VERCEL_ORG_ID" || {
            echo "::error::Missing secret VERCEL_ORG_ID"
            exit 1
          }

          test -n "$VERCEL_PROJECT_ID" || {
            echo "::error::Missing secret VERCEL_FRONTEND_PROJECT_ID"
            exit 1
          }

          test -f apps/frontend/package.json || {
            echo "::error::Frontend package.json is missing"
            exit 1
          }

          echo "Required frontend files and Vercel secrets are present."

      # Link the project at the repository root (no working-directory).
      - name: Link Vercel project
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          mkdir -p .vercel

          node -e '
            const fs = require("fs");
            fs.writeFileSync(
              ".vercel/project.json",
              JSON.stringify({
                orgId: process.env.VERCEL_ORG_ID,
                projectId: process.env.VERCEL_PROJECT_ID
              }, null, 2) + "\n"
            );
          '

          echo "Vercel project link created at repository root."

      - name: Pull Vercel Production Settings
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          npx --yes vercel@"$VERCEL_CLI_VERSION" pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      # Build with Vercel so the output is compatible with deploy --prebuilt.
      - name: Build Frontend for Production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          npx --yes vercel@"$VERCEL_CLI_VERSION" build \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN"

      - name: Verify frontend build artifact
        shell: bash
        run: |
          set -euo pipefail

          test -d .vercel/output || {
            echo "::error::Vercel build did not create .vercel/output"
            exit 1
          }

          echo "Vercel build output verified."
          ls -la .vercel/output | head -10

      - name: Deploy Frontend to Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail

          npx --yes vercel@"$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN"
